<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Catálogo | Safezone</title>
<meta name="description" content="Catálogo de hardware, peças de computador e serviços da Safezone. Filtre por categoria, preço, condição e disponibilidade.">
<meta property="og:type" content="website"><meta property="og:site_name" content="Safezone">
<meta property="og:title" content="Catálogo | Safezone"><meta property="og:description" content="Catálogo de hardware, peças de computador e serviços da Safezone. Filtre por categoria, preço, condição e disponibilidade.">
<meta property="og:image" content="assets/img/og.jpg"><meta name="theme-color" content="#080A08">
<link rel="icon" href="assets/img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/site.css">
</head>
<body data-page="catalog">
<div id="hdr"></div>
<main id="main">
<div class="wrap"><div class="page-h"><h1>Catálogo</h1><p>Pesquise e filtre os produtos disponíveis.</p></div>
<div class="shop"><form class="filters" id="filters" aria-label="Filtros"><div id="fform"><h2>Filtros</h2>
  <label class="fld">Pesquisar<input id="fq" type="search" placeholder="Nome, marca, modelo…" autocomplete="off"></label>
  <label class="fld">Categoria<select id="fcat"></select></label>
  <label class="fld">Condição<select id="fcond"><option value="">Todas</option><option>Novo</option><option>Seminovo</option></select></label>
  <div class="fld">Faixa de preço (R$)<div class="row2"><input id="fmin" inputmode="decimal" placeholder="Mín." aria-label="Preço mínimo"><input id="fmax" inputmode="decimal" placeholder="Máx." aria-label="Preço máximo"></div></div>
  <label class="chk"><input type="checkbox" id="fpromo"> Somente em promoção</label>
  <label class="chk"><input type="checkbox" id="fdisp"> Somente disponíveis</label></div></form>
<div><div class="toolbar"><button class="btn btn-sm fbtn" id="fbtn" aria-expanded="false" aria-controls="filters">Filtros</button><span id="count" aria-live="polite"></span>
  <label class="sr" for="fsort">Ordenar</label><select class="in" id="fsort" style="width:auto"><option value="recent">Mais recentes</option><option value="asc">Menor preço</option><option value="desc">Maior preço</option><option value="name">Nome (A–Z)</option></select></div>
  <div class="grid" id="grid"></div></div></div></div>
</main>
<div id="ftr"></div>
<script src="assets/js/config.js"></script><script src="assets/js/util.js"></script><script src="assets/js/public.js"></script>
</body>
</html>
